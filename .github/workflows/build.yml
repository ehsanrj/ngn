name: Build APK and EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare and Build EXE
        shell: bash
        run: |
          if [ ! -f index.html ]; then echo "ERROR: index.html not found!" && exit 1; fi
          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');
          function createWindow() {
            const win = new BrowserWindow({ width: 1024, height: 768, autoHideMenuBar: true });
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          EOF
          rm -f package.json package-lock.json
          npm init -y
          npm pkg set main="main.js"
          npm install --save-dev electron @electron/packager
          npx @electron/packager . MiniFarmDefense --platform=win32 --arch=x64 --out=dist --overwrite
      - uses: actions/upload-artifact@v4
        with:
          name: MiniFarmDefense-Windows-EXE
          path: dist/MiniFarmDefense-win32-x64/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Prepare and Build APK
        run: |
          if [ ! -f index.html ]; then echo "ERROR: index.html not found!" && exit 1; fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          rm -rf www android package.json package-lock.json capacitor.config.*
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "MiniFarmDefense" "com.minifarm.defense" --web-dir=www
          npx cap add android
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MiniFarmDefense-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
